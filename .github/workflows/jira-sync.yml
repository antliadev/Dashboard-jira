name: Sincronização Automática Jira

on:
  schedule:
    # A cada 30 min entre 09:00 e 20:30 UTC (06:00 às 17:30 BRT), em dias úteis.
    - cron: '*/30 9-20 * * 1-5'
    # Última execução diária: 21:00 UTC (18:00 BRT).
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Permite disparar manualmente pela aba Actions do GitHub

jobs:
  auto-sync:
    name: Executar Auto-Sync Jira
    runs-on: ubuntu-latest
    steps:
      - name: Disparar worker de sincronização
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::O secret CRON_SECRET não está configurado no repositório."
            exit 1
          fi

          echo "Disparando worker de sincronização no backend..."
          curl --fail-with-body --show-error --silent \
            --retry 2 \
            --max-time 300 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://jiradash.antlia.com.br/api/jira/sync/worker"

          echo
          echo "Sincronização automática concluída com resposta HTTP 2xx."
